<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Send a product and delivery enquiry to Varsity Bakery.">
<meta name="keywords" content="Varsity Bakery, bakery Pretoria, Menlopark bakery, fresh meals, bakery products">
<title>Varsity Bakery | Enquiry</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<header class="site-header"><div class="container header-inner">
<div><a class="logo" href="index.html">Varsity Bakery</a><p class="tagline">Fresh and affordable bakery products in Menlopark, Pretoria.</p></div><nav aria-label="Main navigation"><ul>
<li><a class="" href="index.html">Home</a></li>
<li><a class="" href="about.html">About Us</a></li>
<li><a class="" href="products.html">Products/Menu</a></li>
<li><a class="" href="gallery.html">Gallery</a></li>
<li><a class="active" href="enquiry.html">Enquiry</a></li>
<li><a class="" href="contact.html">Contact</a></li>
</ul></nav>
</div></header>
<main><div class="container page-title"><h1>Product Enquiry</h1><p>Ask about a product, order option or delivery.</p></div>
<section class="section"><div class="container">
<form id="enquiryForm" action="#" method="post" novalidate>
<div class="form-group"><label for="enquiryName">Name</label><input id="enquiryName" name="name" type="text" minlength="2" required><div class="error" id="enquiryNameError"></div></div>
<div class="form-group"><label for="enquiryEmail">Email</label><input id="enquiryEmail" name="email" type="email" required><div class="error" id="enquiryEmailError"></div></div>
<div class="form-group"><label for="enquiryProduct">What are you asking about?</label><select id="enquiryProduct" name="product" required><option value="">Choose one</option><option>Breakfast</option><option>Sandwiches</option><option>Burgers</option><option>Chicken</option><option>Other menu item</option></select><div class="error" id="enquiryProductError"></div></div>
<div class="form-group"><label for="enquiryMethod">Delivery or pickup?</label><select id="enquiryMethod" name="method" required><option value="">Choose one</option><option value="delivery">Delivery</option><option value="pickup">Pickup</option></select><div class="error" id="enquiryMethodError"></div></div>
<div class="form-group"><label for="enquiryMessage">Message</label><textarea id="enquiryMessage" name="message" rows="5" minlength="10" required></textarea><div class="error" id="enquiryMessageError"></div></div>
<button class="btn" type="submit">Check Enquiry</button>
</form><div id="enquiryResult" class="success" hidden></div>
</div></section></main>
<footer class="site-footer"><div class="container"><p>&copy; 2026 Varsity Bakery.</p><p><a href="contact.html">Contact us</a> | <a href="enquiry.html">Make an enquiry</a></p></div></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/script.js"></script>
</body></html>
